<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Organizer</title><link rel="stylesheet" href="common.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101724"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Organizer"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head><body><header><div><h1>Personal Organizer</h1><div id="date" class="muted"></div></div><a class="status-button" href="control.html" aria-label="Open Control"><span aria-hidden="true">⚙</span> Control</a></header><main class="grid"><section id="calendar-panel" class="panel"><div class="calendar-heading"><button id="previous-month" class="month-nav-button" type="button" aria-label="Previous month" title="Previous month"><span aria-hidden="true">‹</span></button><h2 id="month"></h2><button id="next-month" class="month-nav-button" type="button" aria-label="Next month" title="Next month"><span aria-hidden="true">›</span></button><button id="today" class="today-button" type="button">Today</button></div><div id="calendar" class="calendar"></div></section><section id="agenda-panel" class="panel"><h2 id="agenda-title">Agenda</h2><div id="agenda"></div></section><section id="tasks-panel" class="panel"><h2>Household checklist</h2><div id="tasks"></div></section><section id="notes-panel" class="panel"><h2>Notes</h2><div id="notes" class="notes"></div></section></main><script src="db.js"></script><script src="common.js"></script><script src="pwa.js"></script><script>
let selected=localDay();function selectDay(day){const previous=selected;selected=day;state.view='overview';state.selected_day=day;render();DB.setView('overview',day).catch(error=>{alert(error.message);DB.snapshot().then(s=>{state=s;render()}).catch(()=>{selected=previous;state.selected_day=previous;render()})})}function shiftMonth(offset){const current=new Date((state.selected_day||selected)+'T12:00:00'),year=current.getFullYear(),month=current.getMonth()+offset,day=current.getDate(),target=new Date(year,month,1,12),lastDay=new Date(target.getFullYear(),target.getMonth()+1,0,12).getDate();selectDay(`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(Math.min(day,lastDay)).padStart(2,'0')}`)}$('#previous-month').onclick=()=>shiftMonth(-1);$('#next-month').onclick=()=>shiftMonth(1);$('#today').onclick=()=>selectDay(localDay());function render(){let view=state.view||'overview';selected=state.selected_day||selected;let dt=new Date(selected+'T12:00:00');$('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('#month').textContent=dt.toLocaleDateString(undefined,{month:'long',year:'numeric'});calendar($('#calendar'),selected,selectDay);$('#agenda-title').textContent='Agenda · '+dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});let ev=state.events.filter(x=>x.day===selected);$('#agenda').innerHTML=ev.length?ev.map(x=>`<div class="event"><small>${esc(formatTime(x.time))} · ${esc(x.category)}</small><div><span class="dot event-dot dot-${esc(x.color||'blue')}" aria-hidden="true"></span>${esc(x.title)}${x.description?` <span class="event-description">· ${esc(x.description)}</span>`:''}</div></div>`).join(''):'<p class="muted">No events for this day.</p>';$('#tasks').innerHTML=taskRows();bindTasks($('#tasks'));$('#notes').textContent=state.notes||'No notes yet.';for(let id of ['calendar','agenda','tasks','notes'])$('#'+id+'-panel').classList.toggle('hidden',view!=='overview'&&view!==(id==='agenda'?'calendar':id));}connect(render);setInterval(()=>{$('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})},60000);
</script></body></html>
