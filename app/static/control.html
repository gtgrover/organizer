<!doctype html><!-- GENERATED from shared/control.html by tools/sync.py. Edit that file, not this one. -->
<html lang="en" data-app="home-organizer">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Home Organizer Controller</title>
	<link rel="stylesheet" href="/static/common.css">
	<link rel="stylesheet" href="/static/print.css">
	
</head>
<body style="max-width:650px;margin:auto">
	<header>
		<div><h1>Control</h1><div class="muted">Shared household organizer</div></div>
		<a class="status-button" href="/display" aria-label="Open Display"><span aria-hidden="true">▣</span> Display</a>
	</header>
	<section class="panel">
		<h2>Control wall display</h2>
		<div class="actions">
			<button data-view="overview">Overview</button>
			<button data-view="calendar">Calendar</button>
			<button data-view="tasks">Tasks</button>
			<button data-view="notes">Notes</button>
		</div>
		<label for="print-month">Month to print</label>
		<input id="print-month" type="month">
		<button id="print-month-calendar" type="button" style="margin-top:8px">Print selected month</button>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2 id="event-form-heading">New calendar event</h2>
		<form id="event-form">
			<label for="event-day">Date</label>
			<input id="event-day" type="date" required>
			<label for="event-time">Time (optional)</label>
			<input id="event-time" type="time">
			<label for="event-title">Event</label>
			<input id="event-title" maxlength="160" required placeholder="Appointment or activity">
			<label for="event-description">Description (not shown on display or print)</label>
			<textarea id="event-description" rows="3" maxlength="1000" placeholder="Extra details for the household"></textarea>
			<label for="event-color">Calendar dot color</label>
			<select id="event-color">
				<option value="blue">Blue</option><option value="red">Red</option><option value="green">Green</option><option value="yellow">Yellow</option><option value="purple">Purple</option><option value="orange">Orange</option>
			</select>
			<label for="event-category">Category</label>
			<select id="event-category">
				<option>Home</option><option>Personal</option><option>Errands</option><option>Other</option>
			</select>
			<div class="actions" style="margin-top:10px">
				<button id="event-submit" type="submit">Add event</button>
				<button id="cancel-event-edit" type="button" hidden>Cancel edit</button>
			</div>
		</form>
		<div id="events"></div>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2>Checklist</h2>
		<div id="tasks"></div>
		<form id="task-form" class="actions" style="margin-top:10px">
			<input id="task-title" placeholder="New item" maxlength="160" required>
			<button type="submit">Add</button>
		</form>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2>Household notes</h2>
		<textarea id="notes" rows="5" maxlength="4000"></textarea>
		<button id="save-notes" style="margin-top:8px">Save notes</button>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2>Backup</h2>
		<p class="muted" style="margin-top:0">Download everything in this organizer as a file, or load one back in. Backup files also work with the offline Personal Organizer app.</p>
		<button id="export-data" class="backup-button" type="button">Backup</button>
		<p id="backup-session" class="backup-state" role="status"></p>
		<label for="import-file">Import a backup file</label>
		<input id="import-file" type="file" accept=".json,application/json">
		<label for="import-mode">When importing</label>
		<select id="import-mode">
			<option value="merge">Merge into my data (no duplicates)</option>
			<option value="replace">Replace all my data</option>
		</select>
		<button id="import-data" type="button" style="margin-top:8px;width:100%">Import</button>
		<p id="backup-status" class="status" role="status"></p>
	</section>
	<div id="print-calendar" aria-hidden="true"></div>
	<script src="/static/db-server.js"></script>
	<script src="/static/common.js"></script>
	<script src="/static/backup.js"></script>
	
	<script>
		let editingEventId = null;
		// The day selected on the display (chosen there with its calendar).
		const selectedDay = () => state.selected_day || localDay();
		$('#print-month').value = localDay().slice(0, 7);
		$('#event-day').value = localDay();
		// The new-event date follows the day selected on the display, until someone
		// picks a date in the event form themselves.
		let eventDayChosen = false;
		['input', 'change'].forEach(type => $('#event-day').addEventListener(type, () => { eventDayChosen = true; }));
		function followSelectedDay() {
			if (editingEventId !== null || eventDayChosen || document.activeElement === $('#event-day')) return;
			$('#event-day').value = selectedDay();
		}

		function resetEventForm() {
			editingEventId = null;
			$('#event-form').reset();
			eventDayChosen = false;
			$('#event-day').value = selectedDay();
			$('#event-form-heading').textContent = 'New calendar event';
			$('#event-submit').textContent = 'Add event';
			$('#cancel-event-edit').hidden = true;
		}

		function beginEventEdit(eventId) {
			const event = state.events.find(item => item.id === eventId);
			if (!event) return;
			editingEventId = eventId;
			$('#event-day').value = event.day;
			$('#event-time').value = event.time;
			$('#event-title').value = event.title;
			$('#event-description').value = event.description || '';
			$('#event-color').value = event.color || 'blue';
			$('#event-category').value = event.category;
			$('#event-form-heading').textContent = 'Edit calendar event';
			$('#event-submit').textContent = 'Save changes';
			$('#cancel-event-edit').hidden = false;
			$('#event-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
		}

		// Prints the month chosen in "Month to print" (printMonth is in common.js).
		function printSelectedMonth() {
			const [year, month] = ($('#print-month').value || localDay().slice(0, 7)).split('-').map(Number);
			printMonth(year, month);
		}

		function render() {
			followSelectedDay();
			$('#tasks').innerHTML = state.tasks.map(task => `<div class="task"><label><input data-task="${esc(task.id)}" type="checkbox" ${task.done ? 'checked' : ''}>${esc(task.title)}</label><button data-del-task="${esc(task.id)}">Delete</button></div>`).join('') || '<p class="muted">No tasks yet.</p>';
			bindTasks($('#tasks'));
			document.querySelectorAll('[data-del-task]').forEach(button => {
				button.onclick = () => DB.deleteTask(button.dataset.delTask).catch(showError);
			});
			if (document.activeElement !== $('#notes')) $('#notes').value = state.notes;

			const events = state.events.filter(event => event.day === selectedDay());
			$('#events').innerHTML = events.map(event => `<div class="event"><small>${esc(event.day)} · ${esc(formatTime(event.time))} · ${esc(event.category)}</small><div>${esc(event.title)}</div><div class="actions"><button type="button" data-edit-event="${esc(event.id)}">Edit</button><button type="button" data-del-event="${esc(event.id)}">Delete</button></div></div>`).join('') || '<p class="muted">No events for this date.</p>';
			document.querySelectorAll('[data-edit-event]').forEach(button => {
				button.onclick = () => beginEventEdit(button.dataset.editEvent);
			});
			document.querySelectorAll('[data-del-event]').forEach(button => {
				button.onclick = async () => {
					const eventId = button.dataset.delEvent;
					try {
						await DB.deleteEvent(eventId);
						if (editingEventId === eventId) resetEventForm();
					} catch (error) {
						alert(error.message);
					}
				};
			});
			showBackupState();
		}

		// "Backed up this session?" Works on every device: we remember when Backup was last
		// used in this browser session, plus a fingerprint of the data at that moment, and
		// compare it with the data now. (Resets when the app or tab is closed.)
		const backupKey = (document.documentElement.dataset.app || 'organizer') + '-backup-session';
		function dataFingerprint() {
			const text = JSON.stringify([state.events, state.tasks, state.notes]);
			let h = 2166136261; // FNV-1a hash: a short string is enough to spot any change
			for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
			return (h >>> 0).toString(36) + ':' + text.length;
		}
		let backupInMemory = null; // fallback if the browser blocks sessionStorage
		function readBackupSession() {
			try { return JSON.parse(sessionStorage.getItem(backupKey)) || backupInMemory; } catch (_) { return backupInMemory; }
		}
		function showBackupState() {
			const done = readBackupSession();
			const el = $('#backup-session');
			if (!done) {
				el.className = 'backup-state warn';
				el.textContent = '⚠ Not backed up yet this session';
				return;
			}
			const at = new Date(done.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
			if (done.fingerprint === dataFingerprint()) {
				el.className = 'backup-state ok';
				el.textContent = `✓ Backed up at ${at}`;
			} else {
				el.className = 'backup-state warn';
				el.textContent = `⚠ Changes since your backup at ${at}. Tap Backup again.`;
			}
		}

		// Used by pwa.js: don't auto-reload for an app update while something is being typed.
		window.hasUnsavedInput = () =>
			editingEventId !== null ||
			!!$('#event-title').value || !!$('#event-description').value || !!$('#task-title').value ||
			$('#notes').value !== (state.notes || '') || !!$('#import-file').value;

		connect(render);
		document.querySelectorAll('[data-view]').forEach(button => {
			button.onclick = () => DB.setView(button.dataset.view).catch(showError);
		});
		$('#print-month-calendar').onclick = printSelectedMonth;
		$('#cancel-event-edit').onclick = resetEventForm;
		$('#event-form').onsubmit = async event => {
			event.preventDefault();
			const isEditing = editingEventId !== null;
			const payload = {
				day: $('#event-day').value,
				time: $('#event-time').value,
				title: $('#event-title').value,
				description: $('#event-description').value,
				color: $('#event-color').value,
				category: $('#event-category').value
			};
			try {
				if (isEditing) await DB.updateEvent(editingEventId, payload);
				else await DB.addEvent(payload);
				if (isEditing) resetEventForm();
				else {
					$('#event-title').value = '';
					$('#event-description').value = '';
				}
			} catch (error) {
				alert(error.message);
			}
		};
		$('#task-form').onsubmit = async event => {
			event.preventDefault();
			try {
				await DB.addTask($('#task-title').value);
				$('#task-title').value = '';
			} catch (error) {
				alert(error.message);
			}
		};
		$('#save-notes').onclick = () => DB.saveNotes($('#notes').value).catch(showError);

		$('#export-data').onclick = async () => {
			try {
				const fingerprint = dataFingerprint(); // the data being saved
				const name = await Backup.exportAs('json');
				backupInMemory = { at: new Date().toISOString(), fingerprint };
				try { sessionStorage.setItem(backupKey, JSON.stringify(backupInMemory)); } catch (_) { /* storage blocked: memory copy still works */ }
				$('#backup-status').textContent = `Saved ${name}.`;
				showBackupState();
			} catch (error) {
				// AbortError = the share sheet was closed without saving: not counted as a backup
				if (error.name !== 'AbortError') alert(error.message);
			}
		};
		$('#import-data').onclick = async () => {
			const file = $('#import-file').files[0];
			const mode = $('#import-mode').value;
			if (!file) { alert('Choose a backup file first.'); return; }
			if (mode === 'replace' && !confirm('Replace ALL events, checklist items and notes on this device with the contents of this file? This cannot be undone.')) return;
			try {
				const result = await Backup.importFile(file, mode);
				$('#backup-status').textContent = Backup.describe(result);
				$('#import-file').value = '';
			} catch (error) {
				alert('Import failed: ' + error.message);
			}
		};
	</script>
</body>
</html>
