<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Home Organizer Controller</title>
	<link rel="stylesheet" href="/static/common.css">
</head>
<body style="max-width:650px;margin:auto">
	<header>
		<div><h1>Control</h1><div class="muted">Shared household organizer</div></div>
		<a class="status-button" href="/display" aria-label="Open Display"><span aria-hidden="true">▣</span> Display</a>
	</header>
	<section class="panel">
		<h2>Control wall display</h2>
		<div class="actions">
			<button data-view="overview">Overview</button>
			<button data-view="calendar">Calendar</button>
			<button data-view="tasks">Tasks</button>
			<button data-view="notes">Notes</button>
		</div>
		<label for="day">Selected date</label>
		<input id="day" type="date">
		<button id="show-day" style="margin-top:8px">Show date on display</button>
		<label for="print-month">Month to print</label>
		<input id="print-month" type="month">
		<button id="print-month-calendar" type="button" style="margin-top:8px">Print selected month</button>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2 id="event-form-heading">New calendar event</h2>
		<form id="event-form">
			<label for="event-day">Date</label>
			<input id="event-day" type="date" required>
			<label for="event-time">Time (optional)</label>
			<input id="event-time" type="time">
			<label for="event-title">Event</label>
			<input id="event-title" maxlength="160" required placeholder="Appointment or activity">
			<label for="event-description">Description (not shown on display or print)</label>
			<textarea id="event-description" rows="3" maxlength="1000" placeholder="Extra details for the household"></textarea>
			<label for="event-color">Calendar dot color</label>
			<select id="event-color">
				<option value="blue">Blue</option><option value="red">Red</option><option value="green">Green</option><option value="yellow">Yellow</option><option value="purple">Purple</option><option value="orange">Orange</option>
			</select>
			<label for="event-category">Category</label>
			<select id="event-category">
				<option>Home</option><option>Personal</option><option>Errands</option><option>Other</option>
			</select>
			<div class="actions" style="margin-top:10px">
				<button id="event-submit" type="submit">Add event</button>
				<button id="cancel-event-edit" type="button" hidden>Cancel edit</button>
			</div>
		</form>
		<div id="events"></div>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2>Checklist</h2>
		<div id="tasks"></div>
		<form id="task-form" class="actions" style="margin-top:10px">
			<input id="task-title" placeholder="New item" maxlength="160" required>
			<button type="submit">Add</button>
		</form>
	</section>
	<section class="panel" style="margin-top:14px">
		<h2>Household notes</h2>
		<textarea id="notes" rows="5" maxlength="4000"></textarea>
		<button id="save-notes" style="margin-top:8px">Save notes</button>
	</section>
	<script src="/static/common.js"></script>
	<script>
		let editingEventId = null;
		$('#day').value = localDay();
		$('#print-month').value = localDay().slice(0, 7);
		$('#event-day').value = localDay();

		function resetEventForm() {
			editingEventId = null;
			$('#event-form').reset();
			$('#event-day').value = localDay();
			$('#event-form-heading').textContent = 'New calendar event';
			$('#event-submit').textContent = 'Add event';
			$('#cancel-event-edit').hidden = true;
		}

		function beginEventEdit(eventId) {
			const event = state.events.find(item => item.id === eventId);
			if (!event) return;
			editingEventId = eventId;
			$('#event-day').value = event.day;
			$('#event-time').value = event.time;
			$('#event-title').value = event.title;
			$('#event-description').value = event.description || '';
			$('#event-color').value = event.color || 'blue';
			$('#event-category').value = event.category;
			$('#event-form-heading').textContent = 'Edit calendar event';
			$('#event-submit').textContent = 'Save changes';
			$('#cancel-event-edit').hidden = false;
			$('#event-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
		}

		function printMonth() {
			const [year, month] = ($('#print-month').value || localDay().slice(0, 7)).split('-').map(Number);
			const monthDate = new Date(year, month - 1, 1, 12);
			const monthLabel = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
			const firstWeekday = new Date(year, month - 1, 1).getDay();
			const daysInMonth = new Date(year, month, 0).getDate();
			const dayCells = Array.from({ length: 42 }, (_, index) => {
				const dayNumber = index - firstWeekday + 1;
				if (dayNumber < 1 || dayNumber > daysInMonth) return '<div class="day outside"></div>';
				const day = `${year}-${String(month).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
				const events = state.events.filter(event => event.day === day);
				const eventMarkup = events.map(event => {
					const time = event.time ? `<span class="time">${esc(formatTime(event.time))}</span> ` : '';
					return `<div class="print-event">${time}${esc(event.title)}</div>`;
				}).join('');
				return `<div class="day"><div class="day-number">${dayNumber}</div>${eventMarkup}</div>`;
			}).join('');
			const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
				.map(day => `<div class="weekday">${day}</div>`).join('');
			const printWindow = window.open('', '_blank');
			if (!printWindow) {
				alert('Allow pop-ups to print the calendar.');
				return;
			}
			printWindow.onload = () => {
				printWindow.focus();
				printWindow.print();
			};
			printWindow.document.open();
			printWindow.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(monthLabel)} Calendar</title><style>
				@page { size: letter landscape; margin: .25in; }
				* { box-sizing: border-box; }
				html, body { margin: 0; width: 10.5in; height: 8in; font-family: Arial, sans-serif; color: #111; }
				h1 { height: .4in; margin: 0; font-size: 20pt; line-height: .4in; }
				.weekdays, .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
				.weekdays { height: .3in; align-items: center; text-align: center; font-size: 9pt; font-weight: 700; }
				.month-grid { height: 7.3in; grid-template-rows: repeat(6, minmax(0, 1fr)); border-top: 1px solid #333; border-left: 1px solid #333; }
				.day { min-width: 0; min-height: 0; overflow: hidden; padding: .045in; border-right: 1px solid #333; border-bottom: 1px solid #333; }
				.day-number { margin-bottom: .025in; font-size: 9pt; font-weight: 700; }
				.print-event { margin: .02in 0; font-size: 7.5pt; line-height: 1.15; overflow-wrap: anywhere; }
				.time { font-weight: 700; }
				@media print { html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
			</style></head><body><h1>${esc(monthLabel)}</h1><div class="weekdays">${weekdays}</div><div class="month-grid">${dayCells}</div></body></html>`);
			printWindow.document.close();
		}

		function render() {
			const selected = state.selected_day || localDay();
			if (document.activeElement !== $('#day')) $('#day').value = selected;
			$('#tasks').innerHTML = state.tasks.map(task => `<div class="task"><label><input data-task="${task.id}" type="checkbox" ${task.done ? 'checked' : ''}>${esc(task.title)}</label><button data-del-task="${task.id}">Delete</button></div>`).join('') || '<p class="muted">No tasks yet.</p>';
			bindTasks($('#tasks'));
			document.querySelectorAll('[data-del-task]').forEach(button => {
				button.onclick = () => api('tasks/' + button.dataset.delTask, 'DELETE').catch(alert);
			});
			if (document.activeElement !== $('#notes')) $('#notes').value = state.notes;

			const events = state.events.filter(event => event.day === $('#day').value);
			$('#events').innerHTML = events.map(event => `<div class="event"><small>${esc(event.day)} · ${esc(formatTime(event.time))} · ${esc(event.category)}</small><div>${esc(event.title)}</div><div class="actions"><button type="button" data-edit-event="${event.id}">Edit</button><button type="button" data-del-event="${event.id}">Delete</button></div></div>`).join('') || '<p class="muted">No events for this date.</p>';
			document.querySelectorAll('[data-edit-event]').forEach(button => {
				button.onclick = () => beginEventEdit(Number(button.dataset.editEvent));
			});
			document.querySelectorAll('[data-del-event]').forEach(button => {
				button.onclick = async () => {
					const eventId = Number(button.dataset.delEvent);
					try {
						await api('events/' + eventId, 'DELETE');
						if (editingEventId === eventId) resetEventForm();
					} catch (error) {
						alert(error.message);
					}
				};
			});
		}

		connect(render);
		document.querySelectorAll('[data-view]').forEach(button => {
			button.onclick = () => api('view', 'PUT', { view: button.dataset.view, selected_day: $('#day').value }).catch(alert);
		});
		$('#show-day').onclick = () => api('view', 'PUT', { view: 'overview', selected_day: $('#day').value }).catch(alert);
		$('#print-month-calendar').onclick = printMonth;
		$('#day').onchange = render;
		$('#cancel-event-edit').onclick = resetEventForm;
		$('#event-form').onsubmit = async event => {
			event.preventDefault();
			const isEditing = editingEventId !== null;
			const payload = {
				day: $('#event-day').value,
				time: $('#event-time').value,
				title: $('#event-title').value,
				description: $('#event-description').value,
				color: $('#event-color').value,
				category: $('#event-category').value
			};
			try {
				await api(isEditing ? 'events/' + editingEventId : 'events', isEditing ? 'PUT' : 'POST', payload);
				if (isEditing) resetEventForm();
				else {
					$('#event-title').value = '';
					$('#event-description').value = '';
				}
			} catch (error) {
				alert(error.message);
			}
		};
		$('#task-form').onsubmit = async event => {
			event.preventDefault();
			try {
				await api('tasks', 'POST', { title: $('#task-title').value });
				$('#task-title').value = '';
			} catch (error) {
				alert(error.message);
			}
		};
		$('#save-notes').onclick = () => api('notes', 'PUT', { content: $('#notes').value }).catch(alert);
	</script>
</body>
</html>
