# Publishes the offline Personal Organizer (pwa/) to GitHub Pages on every push to main.
# Only the pwa/ folder becomes the website; nothing else in the repo is served.
name: Publish offline app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Refuse to publish if pwa/ is out of date with shared/ (someone forgot tools/sync.py).
      - name: Check generated files are in sync
        run: python3 tools/sync.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
